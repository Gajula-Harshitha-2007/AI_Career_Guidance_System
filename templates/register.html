<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Career Guide</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>


<body>


<div class="register-page">


    <div class="register-card">


        <div class="register-logo">

            <span class="logo-icon">✦</span>

            <span>AI Career Guide</span>

        </div>


        <div class="register-heading">

            <span class="eyebrow">
                GET STARTED
            </span>

            <h1>
                Create your account
            </h1>

            <p>
                Start your personalized career journey.
            </p>

        </div>


        <form method="POST"
              action="/register">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit"
                    class="register-btn">

                Create Account

            </button>


        </form>


        <p class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


    </div>


</div>



{% if error %}

<div class="popup-overlay"
     id="errorPopup">


    <div class="popup-box">


        <div class="popup-icon">
            !
        </div>


        <h2>
            Email Already Registered
        </h2>


        <p>
            This email is already associated with an account.
            Please use another email or log in.
        </p>


        <button
            type="button"
            class="popup-btn"
            onclick="closePopup()"
        >
            OK
        </button>


    </div>


</div>


<script>

function closePopup() {

    document.getElementById("errorPopup").style.display = "none";

}

</script>

{% endif %}



</body>

</html>
